# Builds ternimal for the Asciiverse catalog: one archive per target,
# ternimal-<target>.tar.gz (.zip on Windows), plus SHA256SUMS, attached to a
# GitHub release (hub/catalog/SCHEMA.md, release.source = "github"). Runs
# on a pushed tag of ours (v<version>-av.<n>), or by hand for an existing
# tag.
#
# ternimal is one Rust file with no crates and no Cargo, built with rustc
# alone. Linux builds run in Alpine, where rustc links musl statically, so
# the binaries need nothing on the player's machine; macOS and Windows use
# their own runners.

name: release

on:
  push:
    tags: ["*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          mkdir -p out
          docker run --rm -v "$PWD":/src -w /src rust:1-alpine sh -c '
            rustc -O -C strip=symbols ternimal.rs -o out/ternimal'
          sudo chown -R "$(id -u):$(id -g)" out
          file out/ternimal

      - name: Package
        run: asciiverse/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          rustup target add ${{ matrix.target }}
          mkdir -p out
          rustc -O -C strip=symbols --target ${{ matrix.target }} ternimal.rs -o out/ternimal
          file out/ternimal
          asciiverse/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  windows:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          mkdir -p out
          rustc -O -C strip=symbols --target ${{ matrix.target }} ternimal.rs -o out/ternimal.exe
          asciiverse/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "ternimal $TAG" \
                 --notes "Ternimal ${TAG%%-av.*} from github.com/p-e-w/ternimal, Philipp Emanuel Weidmann's lifeform in the terminal, built for the Asciiverse catalog. Changes from upstream: see PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
